name: Deploy to development

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-offline-launcher
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - name: Init core-tasks submodule
        run: git submodule update --init --depth 1 core-tasks
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shell/package-lock.json
            core-tasks/task-launcher/package-lock.json
      - name: Package core-tasks
        working-directory: core-tasks/task-launcher
        env:
          HUSKY: '0'
        run: npm ci --ignore-scripts && npm run patchPackages && npm run package
      - name: Build
        env:
          HUSKY: '0'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm ci --ignore-scripts && npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_ADMIN }}
          projectId: ${{ secrets.FIREBASE_PROJECT }}
          channelId: offline-launcher
          entryPoint: ./shell
          expires: 30d
